# SPDX-License-Identifier: Apache-2.0
# CI: lint, type-check and test the Python package.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest -q

      - name: shellcheck
        run: shellcheck deploy/*.sh models/*.sh deploy/db-init/*.sh
